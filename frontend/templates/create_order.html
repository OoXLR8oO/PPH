<!-- create_order.html -->
{% extends "base.html" %}

{% block content %}
  <script type="module" src="{{ url_for('static', path='js/create_order.js') }}"></script>

  <h2>Create Order</h2>

  <form id="create-form">

    <!-- Customer Info -->
    <h3>Customer Details</h3>

    <label>Name</label><br>
    <input type="text" name="customer_name" required>

    <br>

    <label>Email</label><br>
    <input
      type="email"
      name="customer_email"
      list="customer-emails"
      required
    >

    <datalist id="customer-emails">
      {% for customer in customers %}
        <option
          value="{{ customer.email }}"
          data-name="{{ customer.name }}"
          data-phone="{{ customer.phone or '' }}"
        ></option>
      {% endfor %}
    </datalist>

    <br>

    <label>Phone</label><br>
    <input type="text" name="customer_phone" required>

    <br>

    <label>Customer Notes</label><br>
    <textarea name="customer_notes" rows="3"></textarea>

    <br>

    <!-- Order Info -->
    <h3>Order Details</h3>

    <label>Film Type</label><br>
    <select name="film_type" required>
      <option value="colour">Colour</option>
      <option value="bw">Black & White</option>
    </select>

    <br>

    <label>Quantity</label><br>
    <input
      type="number"
      name="quantity"
      value="1"
      min="1"
      max="100"
      required
    >

    <br>

    <label>
      <input type="checkbox" name="needs_print" value="true">
      <strong>Needs Print</strong>
    </label>

    <br><br>

    <label>Notes</label><br>
    <textarea name="notes" rows="5"></textarea>

    <br>

    <button class="btn" type="submit">Create Order</button>
  </form>

  <br>

  <a href="{{ url_for('index') }}?view=orders" class="btn clear-btn">
    Back
  </a>
{% endblock %}
